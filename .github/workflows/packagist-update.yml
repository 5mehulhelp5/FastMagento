name: Update Packagist

# Notifies Packagist to re-crawl parkktech/fastmagento whenever master changes or a version
# tag is pushed — replacing Packagist's own GitHub auto-update integration.
#
# Requires two repository secrets (Settings > Secrets and variables > Actions):
#   PACKAGIST_USERNAME  — your Packagist username
#   PACKAGIST_TOKEN     — your Packagist API token (https://packagist.org/profile/ > Show API Token)

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  update-packagist:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::error::PACKAGIST_USERNAME / PACKAGIST_TOKEN secrets are not set."
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Notifying Packagist to update parkktech/fastmagento ..."
          http_code=$(curl -s -o /tmp/packagist-resp.json -w '%{http_code}' \
            -XPOST -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/parkktech/FastMagento"}}')
          echo "HTTP ${http_code}"
          cat /tmp/packagist-resp.json 2>/dev/null || true
          echo
          case "$http_code" in
            200|202) echo "Packagist update triggered." ;;
            *) echo "::error::Packagist update failed (HTTP ${http_code})"; exit 1 ;;
          esac
